spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:big_event}?useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}   # 必须设置环境变量 DB_PASSWORD

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 如果 Redis 有密码，添加下面一行（取消注释并设置环境变量）
      # password: ${REDIS_PASSWORD:}

  main:
    allow-bean-definition-overriding: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: ${SERVER_PORT:8080}

# ========== 阿里云 OSS 配置 ==========
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}   # 默认北京节点，可根据需要修改
    access-key-id: ${OSS_ACCESS_KEY_ID}          # 从环境变量读取，必须设置
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}  # 从环境变量读取，必须设置
    bucket-name: ${OSS_BUCKET_NAME:biggetst-event}  # Bucket 名称，可设置默认值